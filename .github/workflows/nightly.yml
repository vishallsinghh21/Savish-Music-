name: nightly

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleNightly

      - name: Prepare and Sign APK for Direct Install
        run: |
          mkdir -p release_apks
          ORIGINAL_APK=$(find app/build/outputs/apk/nightly/ -name "*.apk" | head -n 1)
          
          # Generate self-signed temporary keystore taaki phone direct install allow kare
          keytool -genkey -v -keystore release.keystore -alias savish -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SavishMusic, OU=Savish, O=Savish, L=Indore, S=MP, C=IN"
          
          # Align aur sign APK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$ORIGINAL_APK" release_apks/Savish-Music-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:123456 --ks-key-alias savish --key-pass pass:123456 --out release_apks/Savish-Music-Nightly.apk release_apks/Savish-Music-aligned.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Savish Music Nightly (Build #${{ github.run_number }})"
          body: |
            ### 🎵 Savish Music Nightly Build
            - Commit: `${{ github.sha }}`
            - Direct Installable APK: Niche diye gaye direct `.apk` file par tap karke download karein aur install karein.
          files: release_apks/Savish-Music-Nightly.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
